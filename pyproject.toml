[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mewcode"
version = "0.1.0"
description = "MewCode — a terminal AI CodingAgent (ch02: LLM transport layer)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mewcode = "mewcode.cli:main"

[tool.setuptools.packages.find]
include = ["mewcode*"]
